name: Publish Snapshot
on:
    workflow_call:
        inputs:
            javaVersion:
                description: "The Java Version that should be used in this workflow."
                default: '21'
                type: string
            artifactVersion:
                description: "The Version of the to be published artifact."
                type: string
            targets:
                description: "The target repositories to publish to. See default for options and input format."
                default: "['github-packages']"
                type: string
jobs:
    build-and-publish:
        permissions:
            contents: read
            packages: write
        env:
            JAVA_VERSION: ${{ inputs.javaVersion }}
            ARTIFACT_VERSION: ${{ inputs.artifactVersion }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
            -   name: Set up JDK ${{ env.JAVA_VERSION }}
                uses: actions/setup-java@v5
                with:
                    java-version: '${{ env.JAVA_VERSION }}'
                    distribution: 'temurin'
            -   name: Set up gradle
                uses: gradle/actions/setup-gradle@v5
            -   name: Gradle publish Snapshot to Github
                if: ${{ contains(fromJSON(inputs.targets),'github-packages') }}
                # Must be two separate gradle invocations or it can fail with a race condition.
                # Most likely because JReleaser does not declare a Gradle dependency from `jreleaserdeploy` to `publish`
                run: ./gradlew publish -Pversion=${{env.ARTIFACT_VERSION}} --stacktrace && ./gradlew jreleaserDeploy -Pversion=${{env.ARTIFACT_VERSION}} --stacktrace
                env:
                    JRELEASER_DEPLOY_MAVEN_GITHUB_USERNAME: ${{ github.actor }}
                    JRELEASER_DEPLOY_MAVEN_GITHUB_TOKEN: ${{ github.token }}
                    JRELEASER_DEPLOY_MAVEN_GITHUB_PASSWORD: ${{ github.token }}
                    JRELEASER_DEPLOY_MAVEN_GITHUB_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
                    JRELEASER_DEPLOY_MAVEN_GITHUB_GITHUB_PACKAGES_PASSWORD: ${{ github.token }}
                    JRELEASER_GITHUB_TOKEN: ${{ github.token }}
                    JRELEASER_GITHUB_PASSWORD: ${{ github.token }}
